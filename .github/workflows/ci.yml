name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify standalone CSS export
        run: |
          test -f packages/ui/dist/styles.css
          ! grep -Eq '@(import|plugin|source)[[:space:]]' packages/ui/dist/styles.css
          npm pack --dry-run --json --workspace @deepgram/ui | node -e '
            let output = "";
            process.stdin.on("data", (chunk) => output += chunk);
            process.stdin.on("end", () => {
              const [{ files }] = JSON.parse(output);
              if (!files.some(({ path }) => path === "dist/styles.css")) process.exit(1);
            });
          '

      - name: Build registry
        run: bun run build:registry

      - name: Build web
        run: bun run build:web
