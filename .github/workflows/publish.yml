name: Publish Registry to CDN

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build registry
        run: bun run build:registry

      - name: Sync ui/r/ to CDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.CDN_AWS_REGION }}
          S3_BUCKET: ${{ vars.CDN_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CDN_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          # Sync all registry JSON files to ui/r/
          # Registry files are regenerated on every release — short TTL on index,
          # long TTL on individual component files (content is stable once released).
          aws s3 sync packages/registry/dist/r/ \
            "s3://${S3_BUCKET}/ui/r/" \
            --cache-control "public, max-age=300, stale-while-revalidate=60" \
            --content-type "application/json" \
            --delete

          # Also sync llms.txt if present
          if [ -f packages/registry/dist/llms.txt ]; then
            aws s3 cp packages/registry/dist/llms.txt \
              "s3://${S3_BUCKET}/ui/llms.txt" \
              --cache-control "public, max-age=300, stale-while-revalidate=60" \
              --content-type "text/plain"
          fi

          # Invalidate CloudFront cache for registry paths
          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --paths "/ui/r/*" "/ui/llms.txt"
          fi

          echo "Published registry to CDN"
          echo "  Registry: https://cdn.deepgram.com/ui/r/index.json"
