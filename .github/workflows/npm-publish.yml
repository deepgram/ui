name: npm Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/ui--release_created'] }}
      version: ${{ steps.release.outputs['packages/ui--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install

      - run: bun run build

      - run: npm publish --provenance --access public
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DEEPGRAM_TOKEN }}

  cdn-sync:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile

      - run: bun run build:registry

      - name: Sync ui/r/ to CDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.CDN_AWS_REGION }}
          S3_BUCKET: ${{ vars.CDN_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CDN_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync packages/registry/dist/r/ \
            "s3://${S3_BUCKET}/ui/r/" \
            --cache-control "public, max-age=300, stale-while-revalidate=60" \
            --content-type "application/json" \
            --delete

          if [ -f packages/registry/dist/llms.txt ]; then
            aws s3 cp packages/registry/dist/llms.txt \
              "s3://${S3_BUCKET}/ui/llms.txt" \
              --cache-control "public, max-age=300, stale-while-revalidate=60" \
              --content-type "text/plain"
          fi

          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --paths "/ui/r/*" "/ui/llms.txt"
          fi

          echo "Published registry to CDN"
          echo "  Registry: https://cdn.deepgram.com/ui/r/index.json"
